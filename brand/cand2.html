<!doctype html><html><head><style>
body{margin:0;background:#2a2d3a;display:flex;gap:28px;padding:24px;flex-wrap:wrap;font-family:sans-serif;color:#ccc}
.c{display:flex;flex-direction:column;align-items:center;gap:10px}
.row{display:flex;gap:14px;align-items:end}
</style></head><body>
<script>
const tile = (inner, id) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="SIZE" height="SIZE">
<defs>
 <linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232647"/><stop offset="1" stop-color="#11132A"/></linearGradient>
 <radialGradient id="gl${id}" cx="0.78" cy="0.12" r="0.7"><stop offset="0" stop-color="#3DEBB0" stop-opacity=".28"/><stop offset="1" stop-color="#3DEBB0" stop-opacity="0"/></radialGradient>
 <linearGradient id="gv${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3DEBB0"/><stop offset=".55" stop-color="#8E73FF"/><stop offset="1" stop-color="#FF6FB5"/></linearGradient>
 <linearGradient id="st${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DF5CD"/><stop offset="1" stop-color="#2FD29B"/></linearGradient>
 <linearGradient id="f1${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B4FF"/><stop offset="1" stop-color="#9C83FF"/></linearGradient>
 <linearGradient id="f2${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E4DFF"/><stop offset="1" stop-color="#5236E0"/></linearGradient>
</defs>
<rect x="12" y="12" width="232" height="232" rx="60" fill="${id.startsWith('E3') ? 'url(#gv'+id+')' : 'url(#bg'+id+')'}"/>
<rect x="12" y="12" width="232" height="232" rx="60" fill="url(#gl${id})"/>
<rect x="12.5" y="12.5" width="231" height="231" rx="59.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
${inner(id)}
</svg>`
const A = id => `<rect x="70" y="56" width="30" height="146" rx="9" fill="url(#st${id})"/>
 <path d="M108 56 L192 104 L108 104 Z" fill="url(#f1${id})"/><path d="M108 104 L192 104 L108 152 Z" fill="url(#f2${id})"/>`
const B = id => `<rect x="66" y="56" width="30" height="146" rx="9" fill="url(#st${id})"/>
 <path d="M106 56 L196 56 L176 140 L106 140 Z" fill="url(#gv${id})"/><path d="M106 56 L196 56 L190 81 L106 81Z" fill="#fff" fill-opacity=".18"/>`
const C = id => `<path d="M84 200 V66 h50 a46 46 0 0 1 0 92 h-50" fill="none" stroke="url(#gv${id})" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>`
const D = id => `<path d="M128 48 L208 192 H48 Z" fill="url(#gv${id})"/><path d="M128 48 L128 192 L48 192 Z" fill="#fff" fill-opacity=".16"/><path d="M128 48 L150 192" stroke="#11132A" stroke-width="5" opacity=".35"/>`

const E1 = id => `<path fill-rule="evenodd" fill="url(#gv${id})" d="M80 50 h56 a54 54 0 0 1 0 108 h-22 v38 a12 12 0 0 1 -12 12 h-22 a12 12 0 0 1 -12 -12 v-134 a12 12 0 0 1 12 -12 Z M114 84 v40 l34 -20 Z"/>`
const E2 = id => `<path fill="url(#st${id})" d="M80 50 h34 v146 a12 12 0 0 1 -12 12 h-22 a12 12 0 0 1 -12 -12 v-134 a12 12 0 0 1 12 -12 Z"/>
 <path fill-rule="evenodd" fill="url(#f2${id})" d="M118 50 h18 a54 54 0 0 1 0 108 h-18 Z M128 84 v40 l34 -20 Z"/>
 <path fill-rule="evenodd" fill="url(#f1${id})" d="M118 50 h18 a54 54 0 0 1 54 54 h-28 L128 84 v20 h-10 Z"/>`
const E3 = id => `<path fill-rule="evenodd" fill="#F4F2FF" d="M80 50 h56 a54 54 0 0 1 0 108 h-22 v38 a12 12 0 0 1 -12 12 h-22 a12 12 0 0 1 -12 -12 v-134 a12 12 0 0 1 12 -12 Z M114 84 v40 l34 -20 Z"/>`
for (const [n, f] of [['E1', E1], ['E2', E2], ['E3', E3]]) {

  const d = document.createElement('div'); d.className = 'c'
  d.innerHTML = `<div>${n}</div><div class="row">${[256, 64, 32, 16].map(s => tile(f, n + s).replace(/SIZE/g, s)).join('')}</div>`
  document.body.appendChild(d)
}
</script></body></html>
